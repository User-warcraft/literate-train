name: 一键启动代理

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: 启动并保活
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CS_NAME=$(gh codespace list --json name --jq '.[0].name')
          echo "Codespace: $CS_NAME"
          
          echo ">>> 唤醒..."
          gh codespace ssh -c "$CS_NAME" -- "echo online"
          
          echo ">>> 同步脚本..."
          gh codespace ssh -c "$CS_NAME" -- "cd /workspaces/codespaces-blank && git config --global --add safe.directory /workspaces/codespaces-blank && git fetch origin && git checkout origin/codespace-literate-train-q76x4rv64jv6c4q94 -- start.sh http.sh"
          
          echo ">>> 启动 VMess..."
          gh codespace ssh -c "$CS_NAME" -- "bash /workspaces/codespaces-blank/start.sh"
          
          echo ""
          echo ">>> 启动 HTTP 代理..."
          gh codespace ssh -c "$CS_NAME" -- "bash /workspaces/codespaces-blank/http.sh"
          
          echo ""
          echo ">>> 保活 2h..."
          for i in $(seq 1 24); do
            echo "[$(date +%H:%M)] $i/24"
            gh codespace ssh -c "$CS_NAME" -- "echo alive" 2>/dev/null || true
            sleep 300
          done
          echo ">>> 完成"
