name: 一键启动代理

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: 运行
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CS_NAME=$(gh codespace list --json name --jq '.[0].name')
          echo "Codespace: $CS_NAME"
          
          echo ">>> 唤醒..."
          gh codespace ssh -c "$CS_NAME" -- "echo online"
          
          echo ">>> 启动代理..."
          gh codespace ssh -c "$CS_NAME" -- "cd /workspaces/codespaces-blank && bash start.sh"
          
          sleep 5
          
          echo ""
          echo "===================="
          echo "  VMess 地址:"
          gh codespace ssh -c "$CS_NAME" -- "grep -oP 'https://\K[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf_vmess.log | tail -1" 2>/dev/null || echo "  获取中..."
          echo ""
          echo "  HTTP 代理地址:"
          gh codespace ssh -c "$CS_NAME" -- "grep -oP 'tcp://\K[a-zA-Z0-9.-]+\.trycloudflare\.com:\d+' /tmp/cf_http.log | tail -1" 2>/dev/null || echo "  获取中..."
          echo ""
          echo "  UUID:"
          gh codespace ssh -c "$CS_NAME" -- "cat /workspaces/codespaces-blank/xray/uuid.txt" 2>/dev/null
          echo "===================="
          
          echo ">>> 保活 2 小时..."
          for i in $(seq 1 24); do
            echo "[$(date '+%H:%M')] 心跳 $i/24"
            gh codespace ssh -c "$CS_NAME" -- "echo alive" || true
            sleep 300
          done
          echo ">>> 完成"
