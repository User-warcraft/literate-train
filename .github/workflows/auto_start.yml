name: 一键启动代理

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: 运行
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          CS_NAME=$(gh codespace list --json name --jq '.[0].name')
          echo "Codespace: $CS_NAME"
          
          echo ">>> 唤醒..."
          gh codespace ssh -c "$CS_NAME" -- "echo online"
          
          echo ">>> 清理..."
          gh codespace ssh -c "$CS_NAME" -- "pkill -9 -f xray 2>/dev/null; pkill -9 -f cloudflared 2>/dev/null; echo done" || true
          sleep 1
          
          echo ">>> Xray..."
          gh codespace ssh -c "$CS_NAME" -- "cd /workspaces/codespaces-blank/xray && nohup ./xray run -config config.json > xray.log 2>&1 &"
          sleep 3
          
          echo ">>> Squid..."
          gh codespace ssh -c "$CS_NAME" -- "command -v squid >/dev/null || sudo apt install -y -qq squid; printf 'http_port 3128\nacl all src 0.0.0.0/0\nhttp_access allow all\n' | sudo tee /etc/squid/squid.conf; sudo service squid restart" || true
          sleep 2
          
          echo ">>> VMess 隧道..."
          gh codespace ssh -c "$CS_NAME" -- "cd /workspaces/codespaces-blank/xray && nohup ./cloudflared tunnel --url http://localhost:8080 > /tmp/cf_vmess.log 2>&1 &"
          sleep 6
          
          echo ">>> HTTP 隧道..."
          gh codespace ssh -c "$CS_NAME" -- "cd /workspaces/codespaces-blank/xray && nohup ./cloudflared tunnel --url tcp://localhost:3128 > /tmp/cf_http.log 2>&1 &"
          sleep 8
          
          echo ""
          echo "===================="
          echo "VMess:"
          gh codespace ssh -c "$CS_NAME" -- "grep trycloudflare /tmp/cf_vmess.log | head -1"
          echo "HTTP:"
          gh codespace ssh -c "$CS_NAME" -- "grep trycloudflare /tmp/cf_http.log | head -1"
          echo "UUID:"
          gh codespace ssh -c "$CS_NAME" -- "cat /workspaces/codespaces-blank/xray/uuid.txt"
          echo "===================="
          
          echo ">>> 保活 2h..."
          for i in $(seq 1 24); do
            echo "[$(date +%H:%M)] $i/24"
            gh codespace ssh -c "$CS_NAME" -- "echo alive" || true
            sleep 300
          done
          echo ">>> 完成"
