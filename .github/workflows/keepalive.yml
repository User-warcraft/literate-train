name: Codespace Keepalive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Codespace Alive
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}  # 关键：用 PAT 代替 GITHUB_TOKEN
        run: |
          echo "[1] 检查 Codespace 状态..."
          
          # 列出所有可用的 Codespace
          CODESPACES=$(gh codespace list --json name,state --jq '.[] | select(.state=="Available") | .name' 2>&1)
          
          if [ -z "$CODESPACES" ]; then
            echo "没有运行中的 Codespace，退出。"
            exit 0
          fi
          
          echo "发现运行中的 Codespace："
          echo "$CODESPACES"
          
          # 向每个 Codespace 发送保活命令
          for cs in $CODESPACES; do
            echo "[+] 向 $cs 发送保活信号..."
            gh codespace ssh -c "$cs" -- "echo keepalive-$(date +%s)" 2>&1 || echo "  警告：$cs 可能正在休眠"
          done
          
          echo "[√] 保活完成"
