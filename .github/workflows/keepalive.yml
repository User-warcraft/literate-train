name: Codespace Keepalive

on:
  schedule:
    # 每 20 分钟发送一次心跳，防止 30 分钟自动休眠
    - cron: '*/20 * * * *'
  workflow_dispatch:  # 支持手动触发测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Codespace Alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有 Codespace 列表
          CODESPACES=$(gh codespace list --json name,state --jq '.[] | select(.state=="Available") | .name')
          
          if [ -z "$CODESPACES" ]; then
            echo "没有发现运行中的 Codespace，跳过。"
          else
            echo "发现运行中的 Codespace："
            echo "$CODESPACES"
            for cs in $CODESPACES; do
              echo "向 Codespace [$cs] 发送保活信号..."
              gh codespace ssh -c "$cs" -- echo "keepalive $(date)"
            done
          fi
