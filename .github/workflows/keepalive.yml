name: Codespace Keepalive via API

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Codespace Alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          
          REPO_OWNER="${{ github.repository_owner }}"
          echo "仓库所有者: $REPO_OWNER"
          
          # 通过 API 获取所有 Codespace
          RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/codespaces?per_page=100")
          
          echo "API 回应: $RESPONSE"
          
          # 提取所有可用的 Codespace 名称
          CODESPACES=$(echo "$RESPONSE" | jq -r '.codespaces[] | select(.state=="Available") | .name' 2>/dev/null)
          
          if [ -z "$CODESPACES" ]; then
            echo "没有运行中的 Codespace，正常退出。"
            exit 0
          fi
          
          for cs in $CODESPACES; do
            echo "向 $cs 发起保活请求..."
            # 用简单的 API 调用来更新 Codespace 的活动时间戳
            curl -s -X PATCH -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/codespaces/$cs" \
              -d '{"idle_timeout_minutes":30}' || echo "保活失败: $cs"
          done
          
          echo "保活完成"
